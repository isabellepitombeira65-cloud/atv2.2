<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Linktree - Tema Livre</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link para o arquivo CSS separado -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md mx-auto bg-slate-800/80 backdrop-blur-md rounded-2xl shadow-2xl p-6 border border-slate-700 text-center">
        
        <!-- Foto de Perfil -->
        <div class="relative w-28 h-28 mx-auto mb-4">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Foto de Perfil" class="w-full h-full object-cover rounded-full border-4 border-purple-500 shadow-lg">
        </div>

        <!-- Nome e Bio -->
        <h1 class="text-2xl font-bold text-white mb-1">Ana Silva</h1>
        <p class="text-purple-300 text-sm mb-6">Criadora de Conteúdo & Desenvolvedora Web 🚀</p>

        <!-- Lista de Links -->
        <div class="flex flex-col gap-4">
            <a href="https://github.com" target="_blank" class="link-btn">
                <span>💻 Meu Portfólio / GitHub</span>
            </a>
            <a href="https://instagram.com" target="_blank" class="link-btn">
                <span>📸 Siga-me no Instagram</span>
            </a>
            <a href="https://youtube.com" target="_blank" class="link-btn">
                <span>🎥 Canal do YouTube</span>
            </a>
            <a href="https://linkedin.com" target="_blank" class="link-btn">
                <span>💼 Conecte-se no LinkedIn</span>
            </a>
            <a href="mailto:contato@email.com" class="link-btn">
                <span>📧 Entre em Contato por E-mail</span>
            </a>
        </div>

        <!-- Rodapé -->
        <footer class="mt-8 text-xs text-slate-400">
            <p>&copy; 2026 Ana Silva. Todos os direitos reservados.</p>
        </footer>

    </div>

</body>
</html>
